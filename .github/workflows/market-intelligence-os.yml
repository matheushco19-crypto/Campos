name: Market Intelligence OS

on:
  push:
    paths: ['market-intelligence-os/**', '.github/workflows/market-intelligence-os.yml']
  pull_request:
    paths: ['market-intelligence-os/**', '.github/workflows/market-intelligence-os.yml']

concurrency:
  group: mi-os-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: market-intelligence-os

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      MI_STORAGE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-intelligence-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
